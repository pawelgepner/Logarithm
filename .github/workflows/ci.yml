name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy unicorn
      - name: Build and run tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Instruction counts on RV32IM and Cortex-M0 (emulated)
        run: |
          sudo apt-get install -y clang lld llvm
          git clone --depth 1 --branch llvmorg-18.1.3 --filter=blob:none --sparse https://github.com/llvm/llvm-project /tmp/llvm
          git -C /tmp/llvm sparse-checkout set compiler-rt/lib/builtins
          BUILTINS=/tmp/llvm/compiler-rt/lib/builtins sh bench/build_mcu.sh
          cc -std=c11 -O2 -DHOST_REFERENCE -Iinclude -o bench/build/host_ref bench/mcu_funcs.c -lm
          python3 bench/emu.py --n 200 --out /tmp/mcu.csv
